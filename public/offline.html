<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#245c49">
    <meta name="robots" content="noindex, nofollow">
    <title>You're offline · Achilias</title>
    <link rel="icon" href="/icons/app-192.png">
    <link rel="stylesheet" href="/offline.css">
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/icons/app-192.png" width="64" height="64" alt="Achilias">
      <p class="eyebrow">YOUR LEARNING WORKSPACE</p>
      <h1>Let's get you connected.</h1>
      <p>Achilias can't reach its server right now. Check your connection and try again.</p>
      <p>Your courses, discussions, and files need a connection. This screen doesn't mean your courses are empty or your account is signed out.</p>
      <button id="retry" type="button">Try again</button>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
